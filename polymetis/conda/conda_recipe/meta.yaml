package:
  name: polymetis
  version: {{ GIT_BUILD_STR }}

source:
  git_url: ../../../..

build:
  number: {{ GIT_DESCRIBE_NUMBER }}
  run_exports:
    - {{ pin_subpackage('polymetis', max_pin='x.x') }}

requirements:
  build:
    - assimp=5.0.1=hdca8b6f_4
    - cmake
    - cpuonly
    - doxygen
    - eigen=3.3.9
    - grpc-cpp ==1.41.1
    - hpp-fcl
    - libprotobuf ==3.18.1
    - openmpi ==2.1.2
    - pinocchio ==2.7.0
    - poco ==1.9.0 # needed by libfranka
    - python ==3.11
    - pytorch ==2.4.1
    - spdlog=1.10.0=h924138e_0
    - urdfdom=2.3.3=hc9558a2_0
    - urdfdom_headers=1.0.5=hc9558a2_2
    - yaml-cpp ==0.6.3

  run:
    - asv
    - black
    - boost ==1.72.0
    - boost-cpp ==1.72.0
    - breathe
    - dash
    - doxygen
    - grpc-cpp ==1.41.1
    - grpcio ==1.59.3
    - mujoco
    - hydra-core ==1.3.2
    - myst-parser
    - numpy
    - openmpi ==2.1.2
    - pandas
    - pinocchio ==2.7.0
    - pip
    - plotly
    - poco ==1.9.0 # needed by libfranka
    - protobuf
    - pymodbus
    - pyserial
    - pytest
    - pytest-benchmark=4.0.0
    - python ==3.11
    - pytorch ==2.4.1
    - scipy
    - spdlog=1.10.0=h924138e_0
    - sphinx
    - sphinx-book-theme
    - tqdm

about:
  home:
